services:
  app:
    container_name: vacancies-parsing
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    working_dir: /var/www
    volumes:
      - .:/var/www
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      TZ: ${TZ:-Europe/Moscow}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped

  webserver:
    container_name: nginx-vacancies
    image: openresty/openresty:alpine
    ports:
      - "127.0.0.1:86:80"
    volumes:
      - ./storage/app/public:/var/www/public
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  composer-cache:
    driver: local
