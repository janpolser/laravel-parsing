services:
  app:
    container_name: vacancies-parsing
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/project.ini:/usr/local/etc/php/conf.d/zz-project.ini:ro
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      TZ: ${TZ:-Europe/Moscow}
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped

  webserver:
    container_name: nginx-vacancies
    image: openresty/openresty:alpine
    volumes:
      - ./storage/app/public:/var/www/public
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - app-network
      - edge
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.laravel-parsing-feeds.entrypoints: web
      traefik.http.routers.laravel-parsing-feeds.rule: "Host(`80.93.187.99`) && PathPrefix(`/feeds/`)"
      traefik.http.routers.laravel-parsing-feeds.service: laravel-parsing-feeds
      traefik.http.services.laravel-parsing-feeds.loadbalancer.server.port: "80"

networks:
  app-network:
    driver: bridge
  edge:
    external: true

volumes:
  composer-cache:
    driver: local
