server {
    listen 80;
    server_name _;
    root /var/www;

    location ~ ^/feeds/([^/]+)$ {
        content_by_lua_block {
            local feed = ngx.var[1]
            local dir = "/var/www/public/" .. feed .. "/latest"

            ngx.log(ngx.NOTICE, "Looking for feed: ", feed, " in directory: ", dir)

            -- Проверяем существование директории через test
            local cmd_check = "test -d '" .. dir .. "' && echo 'exists'"
            local handle_check = io.popen(cmd_check)
            local exists = handle_check:read("*l")
            handle_check:close()

            if not exists then
                ngx.log(ngx.ERR, "Directory not found: ", dir)
                ngx.status = 404
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("Directory not found: " .. dir)
                return
            end

            -- Ищем самый свежий tar-файл (учитываем поддиректории тоже)
            local cmd = "find '" .. dir .. "' -name '*.tar' -type f -printf '%T@ %p\\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-"

            ngx.log(ngx.NOTICE, "Executing command: ", cmd)

            local handle = io.popen(cmd)
            local latest_file = handle:read("*l")
            handle:close()

            -- Если не нашли, проверяем без учета времени
            if not latest_file or latest_file == "" then
                local simple_cmd = "find '" .. dir .. "' -name '*.tar' -type f 2>/dev/null | head -1"
                local simple_handle = io.popen(simple_cmd)
                latest_file = simple_handle:read("*l")
                simple_handle:close()
            end

            -- Выводим отладочную информацию
            if latest_file and latest_file ~= "" then
                ngx.log(ngx.NOTICE, "Latest file found: ", latest_file)

                -- Проверяем, существует ли файл на самом деле
                local test_cmd = "test -f '" .. latest_file .. "' && echo 'file exists'"
                local test_handle = io.popen(test_cmd)
                local file_exists = test_handle:read("*l")
                test_handle:close()

                ngx.log(ngx.NOTICE, "File exists test: ", file_exists or "no")
            else
                ngx.log(ngx.NOTICE, "No tar files found")

                -- Выводим список того, что есть в директории
                local list_cmd = "ls -la '" .. dir .. "' 2>/dev/null"
                local list_handle = io.popen(list_cmd)
                local listing = list_handle:read("*a")
                list_handle:close()

                ngx.log(ngx.NOTICE, "Directory listing for ", dir, ":\n", listing or "empty")
            end

            if not latest_file or latest_file == "" then
                ngx.status = 404
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("No .tar files found in " .. dir)
                return
            end

            -- Проверяем существование файла через io.open
            local f = io.open(latest_file, "rb")
            if not f then
                ngx.log(ngx.ERR, "Cannot open file: ", latest_file, " error: ", err)
                ngx.status = 404
                ngx.header["Content-Type"] = "text/plain"
                ngx.say("File not accessible: " .. latest_file)
                return
            end

            -- Извлекаем оригинальное имя файла
            local original_name = latest_file:match("([^/]+)%.tar$") or latest_file:match("([^/]+)$") or "archive"

            ngx.log(ngx.NOTICE, "Original name: ", original_name)

            -- Получаем размер файла
            local file_size = f:seek("end")
            f:seek("set", 0)  -- Возвращаемся в начало файла
            ngx.log(ngx.NOTICE, "File size: ", file_size)

            -- Устанавливаем заголовки для СКАЧИВАНИЯ
            ngx.header["Content-Type"] = "application/octet-stream"
            ngx.header["Content-Disposition"] = "attachment; filename=\"" .. original_name .. ".tar\""
            ngx.header["Content-Transfer-Encoding"] = "binary"
            ngx.header["Cache-Control"] = "no-cache"
            ngx.header["Content-Length"] = tostring(file_size)

            -- Отправляем файл чанками
            ngx.send_headers()

            local chunk_size = 8192
            while true do
                local chunk = f:read(chunk_size)
                if not chunk then break end
                ngx.print(chunk)
                ngx.flush(true) -- Сбрасываем буфер
            end

            f:close()
            ngx.log(ngx.NOTICE, "File sent successfully")
        }
    }
}
